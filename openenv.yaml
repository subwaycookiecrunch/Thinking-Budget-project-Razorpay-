# Research environment metadata. Product runtime is review_engine.py / app.py.
name: thinking-budget
display_name: "The Thinking Budget"
version: "4.0.0"
description: >
  A local code-review workflow with deterministic resource allocation,
  pretrained model inference, exact source-evidence checks, and explicit
  human-review handoffs. Includes a synthetic OpenEnv research environment,
  an experimental budget-calibration reward, and saved Qwen2.5 LoRA training
  artifacts. No trained-model improvement or production accuracy is claimed.
track: "Razorpay Buildathon 2026 — Track 05 Open Track"
environment:
  class: code_review_env.server.environment:CodeReviewEnvironment
  base: openenv.core.env_server.MCPEnvironment
  supports_concurrent_sessions: true
  session_semantics: "SDK factory creates one environment per session; one active episode per instance"
  code_execution_enabled: false
  difficulty_levels: [easy, medium, hard]
tools:
  - {name: read_file, cost: 1, description: "Read generated source in the selected episode"}
  - {name: search_code, cost: 2, description: "Case-insensitive substring search"}
  - {name: get_function_list, cost: 1, description: "Extract function-like names with language patterns"}
  - {name: flag_vulnerable, cost: 0, description: "Record a file flag with bounded reasoning"}
  - {name: skip_file, cost: 0, description: "Record an unflagged decision with bounded reasoning"}
  - {name: submit_report, cost: 0, description: "Finalize the research episode and reveal scores"}
budgets:
  investigation_points: "2 * file_count"
  flag_allowance: "min(file_count, max(5, ceil(0.4 * file_count)))"
  limitation: "Investigation allowance permits one read of every file; no global hard action cap"
reward:
  type: experimental_composite
  environment_formula: "F1 * (0.35*F1 + 0.20*report_structure + 0.15*step_efficiency + 0.15*reasoning_length_proxy + 0.15*precision_bonus)"
  metacognitive_formula: "(0.5*length_calibration + 0.5*label_alignment) * (0.5 + 0.5*action_coupling)"
  note: "Trainer composite and text fallback are separate paths. Historical runs may precede the current reward."
dataset:
  source: "Synthetic CVE-themed episodes and generated source; not extracted production patches"
  episodes: 150
  file_rows: 2892
  unique_source_paths: 2869
  positive_rows: 319
  negative_only_episodes: 58
  split_status: "All bundled data, including training episodes; not held out"
  canonical_rows: data/cve_training_data.json
  canonical_snippets: data/code_snippets.json
benchmark:
  command: "python benchmark.py"
  results: grpo_output/benchmark_results.json
  primary_metric: "Fraction of dataset-positive files actually read; not defect-detection recall"
  cost_unit: "Source characters returned by bounded reads; not model tokens or money"
  model_inference: false
training_artifacts:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  adapter_config: grpo_output/adapter_config.json
  adapter_weights: grpo_output/adapter_model.safetensors
  method: GRPO
  lora_rank: 16
  lora_alpha: 32
  recorded_steps: 100
  evidence_audit_command: "python scripts/audit_training_evidence.py"
  efficacy_status: "Unproven; recorded action coupling is zero, and most rewards lack environment scores"
product:
  entrypoint: app.py
  engine: review_engine.py
  local_provider: Ollama
  default_model: "qwen3:4b"
  custom_adapter_loaded: false
  thinking_enabled: false
  offline_mode: "Explicitly labeled deterministic source rules"
  tabs: ["Review lab", "Evidence", "Failure lab", "Design decisions"]
  deployment_status: "Local build only; external publication not performed"
  safeguards: ["Input bounds", "Output reservations", "Exact source citation checks", "Explicit abstention", "Failure circuit", "Hash-linked audit"]
tags: [openenv, code-review, resource-allocation, local-inference, source-evidence, grpo-research]
